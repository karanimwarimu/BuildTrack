ServerName localhost
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Nothing outside public/ is reachable; this is belt-and-braces.
    <Directory /var/www/html>
        Require all denied
    </Directory>
    <Directory /var/www/html/public>
        Require all granted
    </Directory>
    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
ServerTokens Prod
